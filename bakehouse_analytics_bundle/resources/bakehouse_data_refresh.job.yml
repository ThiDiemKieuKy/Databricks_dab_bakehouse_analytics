# A sample job for bakehouse_analytics_bundle.

resources:
  jobs:
    bakehouse_data_refresh:
      name: bakehouse_data_refresh

      # --- Job-Level Git Source (Applies to all tasks) ---
      git_source:
        git_url: https://github.com/ThiDiemKieuKy/Databricks_dab_bakehouse_analytics
        git_provider: gitHub
        git_branch: ${var.branch}
      
      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: bakehouse_analytics_bundle/src/customer_360
            source: GIT
        - task_key: notebook_task
          notebook_task:
            notebook_path: bakehouse_analytics_bundle/src/transaction_summary
            source: GIT

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
