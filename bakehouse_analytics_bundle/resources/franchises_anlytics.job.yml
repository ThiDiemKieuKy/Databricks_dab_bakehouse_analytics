resources:
  jobs:
    franchises_anlytics:
      name: Franchises_Anlytics

      # --- Job-Level Git Source (Applies to all tasks) ---
      git_source:
        git_url: https://github.com/ThiDiemKieuKy/Databricks_dab_bakehouse_analytics
        git_provider: gitHub
        git_branch: ${var.branch}
        
      tasks:
        - task_key: franchises_analytics
          disabled: false
          email_notifications: {}
          environment_key: Default
          notebook_task:
            notebook_path: bakehouse_analytics_bundle/src/franchises_anlytics/franchises_analytics
            source: GIT
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}

      parameters:
        - name: catalog
          default: bakehouse_analytics_dev
        - name: schema
          default: rnd

      email_notifications:
        no_alert_for_skipped_runs: false

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"

      max_concurrent_runs: 1

      performance_target: PERFORMANCE_OPTIMIZED

      queue:
        enabled: true

      timeout_seconds: 0
      
      webhook_notifications: {}
