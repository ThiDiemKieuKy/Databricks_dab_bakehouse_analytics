# This workflow validates, deploys, and runs the specified bundle
# within a production target name "prod"
name: 'Production Bakehouse Analytics Deployment'

# runs at a time
concurrency: 1

# trigger this workflow whenever a pull request is pushed to the repo's main branch
on:
  push:
    branches:
      - main
    path:
      - 'bakehouse_analytics_bundle/**' 

jobs:
  deploy:
    name: 'Deploy Bundle'
    runs-on: ubuntu-latest

    steps:
      # check out this repo, so that this workflow can access it
      - uses: actions/checkout@v3

      # download the Databricks CLI
      # see https://github.com/databricks/setup-cli
      - uses: databricks/setup-cli@main

      # deploy the bundle to the "prod" target as defined
      # in the bundle setting files
      - run: databricks bundle deploy
        working-directory: bakehouse_analytics_bundle
        env:
          DATABRICKS_TOKEN: ${{secrets.SP_TOKEN}}
          DATABRICKS_BUNDLE_ENV: prod
